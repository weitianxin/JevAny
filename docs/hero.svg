    <filter id="raised" x="-30%" y="-50%" width="160%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur" />
      <feOffset in="blur" dx="9" dy="9" result="lower" />
      <feFlood flood-color="#bbc5d2" flood-opacity=".74" />
      <feComposite in2="lower" operator="in" result="shade" />
      <feOffset in="blur" dx="-9" dy="-9" result="upper" />
      <feFlood flood-color="#ffffff" flood-opacity=".9" />
      <feComposite in2="upper" operator="in" result="light" />
      <feMerge>
        <feMergeNode in="shade" />
        <feMergeNode in="light" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="card-shadow" x="-10%" y="-20%" width="120%" height="140%" color-interpolation-filters="sRGB">
